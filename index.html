<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Finance Dashboard</h1>
            <p>Track your income and expenses</p>
        </header>

        <section class="summary">

            <div class="card">
                <p>Balance</p>
                <h2 id="balance">Rp 0</h2>
            </div>

            <div class="card">
                <p>Income</p>
                <h2 id="income">Rp 0</h2>
            </div>

            <div class="card">
                <p>Expense</p>
                <h2 id="expense">Rp 0</h2>
            </div>
        </section>

        <section class="transactions">
            <div class="section-header">
                <h2>Transactions</h2>
                <button id="add-transaction-btn">Add Transaction</button>
            </div>

            <input
                type="text"
                id="search-input"
                placeholder="Search transaction..."
            >
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="income">Income</button>
                <button class="filter-btn" data-filter="expense">Expense</button>
            </div>

            <div id="transaction-list"></div>
        </section>

    </div>
    <div id="transaction-modal" class="modal">
        <div class="modal-content">
            <h2>Add Transaction</h2>
            <form id="transaction-form">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="e.g. Salary"
                    required    
                >

                <label for="amount">Amount</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="e.g. 50000"
                    required
                >

                <label for="type">Type</label>
                <select id="type" required>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Food"
                    required    
                >
                
                <div class="form-actions">
                    <button type="button" id="close-modal-btn">Cancel</button>
                    <button type="submit">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>
  

    <script src="script.js"></script>
</body>
</html>
